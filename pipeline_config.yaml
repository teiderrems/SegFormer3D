# Configuration de la pipeline automatisée de segmentation 3D
# Ce fichier définit tous les paramètres configurables de la pipeline

# === PARAMÈTRES DE PRÉTRAITEMENT ===
preprocessing:
  # Taille cible pour le resampling des volumes (en voxels)
  # Valeurs recommandées: 64, 96, 256, 256
  # Plus la taille est grande, plus la précision est élevée mais plus la mémoire GPU est nécessaire
  target_size: 256

  # Méthode de normalisation des intensités
  # 'minmax': Normalisation min-max [0,1]
  # 'zscore': Normalisation z-score (moyenne=0, écart-type=1)
  normalize_method: "zscore"

  # Sauter les patients déjà prétraités (évite le recalcul)
  skip_existing: true

  # Supprimer les slices axiales sans prostate avant le resampling
  # Permet de concentrer la résolution sur la région d'intérêt
  crop_to_prostate: false

  # Nombre de slices de marge à conserver autour de la prostate lors du cropping
  # Utilisé uniquement si crop_to_prostate est activé
  crop_margin: 2

# === PARAMÈTRES DES SPLITS D'ENTRAÎNEMENT ===
splits:
  # Type de split: 'fixed' pour train/val fixe, 'kfold' pour cross-validation
  split_type: "fixed"

  # Pour split_type='fixed': proportions train/validation/test
  # Doivent sommer à 1.0
  train_ratio: 0.6    # 60% pour entraînement
  val_ratio: 0.2      # 20% pour validation
  test_ratio: 0.2     # 20% pour test

  # Pour split_type='kfold': nombre de folds
  k_folds: 5

  # Seed pour reproductibilité
  random_seed: 42

  # Stratification par classe dominante (recommandé: true)
  stratified: true

# === PARAMÈTRES D'ENTRAÎNEMENT ===
training:
  # Nombre d'époques d'entraînement
  num_epochs: 40

  # Taille de batch (adapter selon la mémoire GPU disponible)
  batch_size: 2

  # Learning rate initial
  learning_rate: 0.001

  # Device: 'cuda' pour GPU, 'cpu' pour CPU
  device: "cpu"

# === ARCHITECTURES À UTILISER ===
architectures:
  # Liste des architectures à traiter
  # Options: SegFormer3D
  enabled: "SegFormer3D"

# === CHEMINS DES RÉPERTOIRES ===
paths:
  # Répertoire des données brutes NIfTI
  raw_data_dir: "./data/raw_prostate"

  # Répertoire pour les données prétraitées
  preprocessed_data_dir: "./data/prostate_preprocessed/preprocessed_data_256_256_256"

  # Répertoire des configurations des modèles
  config_dir: "./configs"

  # Répertoire pour sauvegarder les checkpoints
  checkpoint_dir: "./checkpoints"

  # Répertoire pour les résultats d'inférence
  results_dir: "./results"

# === OPTIONS AVANCÉES ===
advanced:
  # Sauter l'étape de prétraitement si déjà fait
  skip_preprocess: false

  # Niveau de verbosité (0=minimal, 1=normal, 2=détaillé)
  verbosity: 2

# === AUGMENTATIONS DE DONNÉES ===
augmentations:
  # Activer ou désactiver les augmentations de données pendant l'entraînement
  # True = appliquer les augmentations sur l'ensemble d'entraînement (val = toujours sans augmentations)
  enabled: true

# === PARAMÈTRES DES DATASETS ===
# Ces paramètres sont injectés automatiquement dans la configuration d'architecture
# (configs/config_<arch>.yaml) au lancement de la pipeline.
# Ils surchargent les valeurs de dataset_parameters et dataloader de la config d'archi.
dataset_parameters:
  # Type de dataset (doit correspondre à un dataset enregistré dans dataloaders/)
  dataset_type: "prostate_seg"

  # Arguments du dataset d'entraînement
  train_dataset_args:
    # Le chemin root est automatiquement déduit de paths.preprocessed_data_dir
    # Le split_file est automatiquement déduit de paths.preprocessed_data_dir + train.csv
    train: true
    # Les augmentations sont contrôlées par la section augmentations.enabled ci-dessus
    # Mode debug: affiche si les augmentations modifient les images (pour les 5 premiers samples)
    debug_augment: false

  # Arguments du dataset de validation
  val_dataset_args:
    train: false
    # Les augmentations sont toujours désactivées en validation
    debug_augment: false

  # Arguments du dataset de test
  test_dataset_args:
    train: false
    debug_augment: false

# === PARAMÈTRES DU DATALOADER ===
dataloader:
  # Taille du batch (surchargé par training.batch_size si défini)
  batch_size: 1

  # Mélanger les données d'entraînement à chaque époque
  shuffle: true

  # Nombre de workers pour le chargement parallèle des données
  # 0 = chargement dans le processus principal (utile pour le debug)
  # 2-4 = valeurs recommandées en production
  num_workers: 0

  # Supprimer le dernier batch s'il est incomplet
  # Recommandé: true pour éviter les problèmes de taille de batch avec BatchNorm
  drop_last: true

# === PARAMÈTRES TRANSFORMER PAR DÉFAUT ===
# Ces paramètres sont appliqués comme valeurs par défaut si une configuration
# d'architecture spécifique ne les définit pas (ex: configs/config_segformer3d.yaml).
transformer:
  # Taille noyau pour l'embedding de patchs 3D. Peut être un int (appliqué à toutes
  # les étapes) ou une liste de 4 entiers (un par étape pyramidale).
  patch_kernel_size: [7, 3, 3, 3]

  # Stride (pas) de la convolution d'embedding. Peut être un int ou une liste de 4 entiers.
  patch_stride: [4, 2, 2, 2]

  # Padding de la convolution d'embedding.
  patch_padding: [3, 1, 1, 1]